name: Publish suno-cli

# Publishes @usedhonda/suno-cli to npm when a version tag (v*) is pushed.
# Uses npm Trusted Publishing (OIDC) — no npm token is stored anywhere.
# Register this repo + workflow as a Trusted Publisher on npmjs.com first.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    defaults:
      run:
        working-directory: suno-cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing needs npm 11.5.1+; the runner ships an older npm.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public
